<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OffBeat - Music Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; }
        .bg-brand-dark { background-color: #121212; }
        .bg-brand-card { background-color: #181818; }
        .bg-brand-card:hover { background-color: #282828; }
        .text-brand-green { color: #1db954; }
        .bg-brand-green { background-color: #1db954; }
        .text-brand-textMuted { color: #a7a7a7; }
        .bg-brand-subtle { background-color: #2a2a2a; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO COM A BARRA DE PESQUISA -->
    <header class="p-4 bg-black/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/10 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-brand-green rounded-full flex items-center justify-center font-bold text-black">
                🎵
            </div>
            <h1 class="text-xl font-bold tracking-wider text-brand-green">OffBeat</h1>
        </div>

        <!-- Campo de Pesquisa -->
        <div class="w-full md:w-1/2 relative">
            <input type="text" id="searchInput" placeholder="Pesquisar músicas, artistas ou álbuns..." 
                class="w-full bg-brand-card text-white placeholder-brand-textMuted px-4 py-2.5 rounded-full border border-white/10 focus:outline-none focus:border-brand-green text-sm shadow-inner transition-colors">
        </div>
    </header>

    <!-- ÁREA PRINCIPAL COM A GRELHA DE MÚSICAS -->
    <main class="p-6 max-w-7xl mx-auto w-full flex-1">
        <h2 id="sectionTitle" class="text-lg font-bold mb-4 text-white">Músicas Recomendadas</h2>
        
        <!-- Grid de Cards de Músicas -->
        <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <p class="text-brand-textMuted text-xs col-span-full">Carregando músicas do servidor...</p>
        </div>
    </main>

    <!-- PLAYER FIXO NO RODAPÉ -->
    <footer class="sticky bottom-0 bg-black/95 border-t border-white/10 p-3 flex flex-col sm:flex-row items-center justify-between gap-3 backdrop-blur-lg z-50">
        <div class="flex items-center gap-3 w-full sm:w-1/3">
            <img id="playerCover" src="https://via.placeholder.com/60/181818/1db954?text=OffBeat" class="w-12 h-12 rounded object-cover border border-white/10" alt="Capa">
            <div class="truncate">
                <p id="playerTitle" class="text-xs font-bold text-white truncate">Selecione uma música</p>
                <p id="playerArtist" class="text-[11px] text-brand-textMuted truncate">OffBeat Player</p>
            </div>
        </div>

        <!-- Elemento de Áudio Nativo do Navegador -->
        <div class="w-full sm:w-1/2 flex justify-center">
            <audio id="audioElement" controls class="w-full max-w-md h-9 rounded-lg opacity-90"></audio>
        </div>
    </footer>

    <!-- SCRIPT DE CONEXÃO -->
    <script src="script.js"></script>
</body>
</html>
